name: Publish release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate package
        run: node scripts/validate-package.js
      - name: Build skill bundle
        run: ./scripts/build-release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/gas-optimizer-v*.zip dist/gas-optimizer-v*.tar.gz dist/SHA256SUMS.txt dist/packaging/homebrew/gas-optimizer.rb dist/packaging/scoop/gas-optimizer.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/gas-optimizer-v*.zip dist/gas-optimizer-v*.tar.gz dist/SHA256SUMS.txt dist/packaging/homebrew/gas-optimizer.rb dist/packaging/scoop/gas-optimizer.json --title "GAS-Optimizer $GITHUB_REF_NAME" --generate-notes --latest --verify-tag
          fi
