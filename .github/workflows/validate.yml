name: Validate skill and universal installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh installers/install.sh installers/uninstall.sh bin/gas-optimizer scripts/test-cli.sh scripts/build-release.sh scripts/publish-package-channels.sh
      - name: Validate Agent Skill package
        run: node scripts/validate-package.js
      - name: Build upload-ready bundle
        run: |
          ./scripts/build-release.sh
          unzip -l "dist/gas-optimizer-v$(cat VERSION).zip" | grep 'gas-optimizer/SKILL.md'
          tar -tzf "dist/gas-optimizer-v$(cat VERSION)-macos.tar.gz" | grep 'bin/gas-optimizer'
          unzip -l "dist/gas-optimizer-v$(cat VERSION)-windows.zip" | grep 'bin/gas-optimizer.cmd'
          test -s dist/SHA256SUMS.txt
          test -f dist/packaging/homebrew/gas-optimizer.rb
          test -f dist/packaging/scoop/gas-optimizer.json
          test -f dist/packaging/winget/Deuk1718.GASOptimizer.yaml
          test -f dist/packaging/winget/Deuk1718.GASOptimizer.installer.yaml
          test -f dist/packaging/winget/Deuk1718.GASOptimizer.locale.en-US.yaml
          grep -q 'bin.write_exec_script' dist/packaging/homebrew/gas-optimizer.rb

  unix-installers:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install, update, and uninstall all user targets
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export CLAUDE_SKILLS_ROOT="$HOME/.claude/skills"
          export AGENT_SKILLS_ROOT="$HOME/.agents/skills"
          ASIDE_ROOT="$RUNNER_TEMP/aside/u/0"
          mkdir -p "$HOME" "$ASIDE_ROOT"
          ./install.sh --target all --scope user --aside-account-root "$ASIDE_ROOT"
          test -f "$ASIDE_ROOT/skills/user/gas-optimizer/SKILL.md"
          test -f "$HOME/.claude/skills/gas-optimizer/SKILL.md"
          test -f "$HOME/.agents/skills/gas-optimizer/SKILL.md"
          ./install.sh --target all --scope user --aside-account-root "$ASIDE_ROOT"
          test -d "$ASIDE_ROOT/backups/skills"
          ./uninstall.sh --target all --scope user --aside-account-root "$ASIDE_ROOT" --yes
          test ! -e "$ASIDE_ROOT/skills/user/gas-optimizer"
          test ! -e "$HOME/.claude/skills/gas-optimizer"
          test ! -e "$HOME/.agents/skills/gas-optimizer"
      - name: Install and uninstall project targets
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/project"
          mkdir -p "$PROJECT"
          ./install.sh --target all --scope project --project-root "$PROJECT"
          test -f "$PROJECT/.claude/skills/gas-optimizer/SKILL.md"
          test -f "$PROJECT/.agents/skills/gas-optimizer/SKILL.md"
          ./uninstall.sh --target all --scope project --project-root "$PROJECT" --yes
          test ! -e "$PROJECT/.claude/skills/gas-optimizer"
          test ! -e "$PROJECT/.agents/skills/gas-optimizer"
      - name: Install jq for CLI smoke tests
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              brew install jq
            else
              sudo apt-get update
              sudo apt-get install -y jq
            fi
          fi
      - name: CLI lifecycle smoke test
        run: ./scripts/test-cli.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, update, and uninstall all user targets
        shell: pwsh
        run: |
          $AsideRoot = Join-Path $env:RUNNER_TEMP "aside\u\0"
          $env:CLAUDE_SKILLS_ROOT = Join-Path $env:RUNNER_TEMP "home\.claude\skills"
          $env:AGENT_SKILLS_ROOT = Join-Path $env:RUNNER_TEMP "home\.agents\skills"
          New-Item -ItemType Directory -Path $AsideRoot -Force | Out-Null
          .\install.ps1 -Target All -Scope User -AsideAccountRoot $AsideRoot
          if (-not (Test-Path (Join-Path $AsideRoot "skills\user\gas-optimizer\SKILL.md"))) { throw "Aside install failed" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_SKILLS_ROOT "gas-optimizer\SKILL.md"))) { throw "Claude install failed" }
          if (-not (Test-Path (Join-Path $env:AGENT_SKILLS_ROOT "gas-optimizer\SKILL.md"))) { throw "Agents install failed" }
          .\install.ps1 -Target All -Scope User -AsideAccountRoot $AsideRoot
          .\uninstall.ps1 -Target All -Scope User -AsideAccountRoot $AsideRoot -Yes
          if (Test-Path (Join-Path $AsideRoot "skills\user\gas-optimizer")) { throw "Aside uninstall failed" }
          if (Test-Path (Join-Path $env:CLAUDE_SKILLS_ROOT "gas-optimizer")) { throw "Claude uninstall failed" }
          if (Test-Path (Join-Path $env:AGENT_SKILLS_ROOT "gas-optimizer")) { throw "Agents uninstall failed" }
      - name: Install and uninstall project targets
        shell: pwsh
        run: |
          $Project = Join-Path $env:RUNNER_TEMP "project"
          New-Item -ItemType Directory -Path $Project -Force | Out-Null
          .\install.ps1 -Target All -Scope Project -ProjectRoot $Project
          if (-not (Test-Path (Join-Path $Project ".claude\skills\gas-optimizer\SKILL.md"))) { throw "Claude project install failed" }
          if (-not (Test-Path (Join-Path $Project ".agents\skills\gas-optimizer\SKILL.md"))) { throw "Agents project install failed" }
          .\uninstall.ps1 -Target All -Scope Project -ProjectRoot $Project -Yes
          if (Test-Path (Join-Path $Project ".claude\skills\gas-optimizer")) { throw "Claude project uninstall failed" }
          if (Test-Path (Join-Path $Project ".agents\skills\gas-optimizer")) { throw "Agents project uninstall failed" }
      - name: CLI lifecycle smoke test
        shell: pwsh
        run: .\scripts\test-cli.ps1

  scoop-channel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GAS-Optimizer from the public Scoop bucket
        shell: pwsh
        run: .\scripts\test-scoop-channel.ps1
